<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家 - おやすみモード</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px 20px;
      text-align: center;
      overflow-y: auto; /* はみ出してもスクロールできるように変更 */
    }
    .header {
      margin-top: 4px;
    }
    .title {
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
    }

    /* BGMコントローラー */
    .audio-player {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .track-info {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 80px;
    }

    /* マロンのカード（画面からはみ出さないサイズ制限） */
    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      margin: 12px 0;
    }
    .marron-card {
      width: 240px;
      max-width: 75vw;
      max-height: 40vh; /* 縦長になりすぎないよう制限 */
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(246, 173, 85, 0.45);
      box-shadow: 0 0 25px rgba(246, 173, 85, 0.25);
      animation: breathe 4s ease-in-out infinite;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marron-card img {
      width: 100%;
      height: 100%;
      max-height: 40vh;
      object-fit: contain;
      display: block;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(246, 173, 85, 0.2);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 35px rgba(246, 173, 85, 0.4);
      }
    }

    .bubble {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #fbd38d;
      backdrop-filter: blur(5px);
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }
    .footer {
      margin-bottom: 8px;
    }
    .message {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.7rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🌙 マロンの添い寝部屋</div>
    
    <div class="audio-player">
      <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
      <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
      <button class="audio-btn" onclick="nextBgm()">⏭</button>
    </div>
  </div>

  <div class="main-stage" onclick="tapMarron()">
    <div class="marron-card">
      <img src="marron.gif" alt="マロン">
    </div>
    <div class="bubble" id="bubbleText">
      スピー… すやすや… 💤
    </div>
    <div class="hint">（タップするとなでなでできるワン）</div>
  </div>

  <div class="footer">
    <div class="message">今日も一日、本当によく頑張ったワン。</div>
    <div class="sub">画面を開いたまま、枕元に置いて休んでね</div>
  </div>

  <audio id="bgmAudio" preload="auto"></audio>

  <script>
    const bgmList = [
      'bgm1.mp3',
      'bgm2.mp3',
      'bgm3.mp3',
      'bgm4.mp3'
    ];

    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');

    audio.volume = 0.3;

    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => {
        console.log('再生待機中:', err);
      });
    }

    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    function nextBgm() {
      playRandomBgm();
    }

    audio.addEventListener('ended', () => {
      playRandomBgm();
    });

    const messages = [
      "スピー… すやすや… 💤",
      "むにゃ… なでなで、あったかいワン… ✨",
      "今日も生きててえらいワン… 🐾",
      "マロンはずっと隣にいるからね… 🌙",
      "ふがっ… 大丈夫、ぜんぶうまくいくワン…"
    ];
    let msgIndex = 0;

    function tapMarron() {
      msgIndex = (msgIndex + 1) % messages.length;
      document.getElementById('bubbleText').innerText = messages[msgIndex];

      if (navigator.vibrate) {
        navigator.vibrate([40]);
      }
    }
  </script>
</body>
</html>
