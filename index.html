<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マロンのお家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* タブバー */
    .tab-bar {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 10px;
      max-width: 95vw;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(246, 173, 85, 0.25);
      color: #fbd38d;
      border: 1px solid rgba(246, 173, 85, 0.4);
    }

    .room-content {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .room-content.active {
      display: flex;
    }
