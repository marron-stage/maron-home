<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家 - おやすみモード</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: center;
      overflow: hidden;
    }
    .header {
      margin-top: 6px;
    }
    .title {
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
    }

    /* BGMコントローラー */
    .audio-player {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: opacity 0.2s;
    }
    .audio-btn:active {
      opacity: 0.6;
    }
    .track-info {
      font-size: 0.78rem;
      color: #94a3b8;
      min-width: 90px;
    }

    /* マロンのサークル */
    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .marron-circle {
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, #2d3748 0%, #1a202c 100%);
      border: 3px solid #f6ad55;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(246, 173, 85, 0.25);
      animation: breathe 4s ease-in-out infinite;
      transition: transform 0.2s ease;
    }
    .marron-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .marron-circle:active {
      transform: scale(0.95);
    }
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(246, 173, 85, 0.2);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 45px rgba(246, 173, 85, 0.4);
      }
    }
    .bubble {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 0.95rem;
      color: #fbd38d;
      backdrop-filter: blur(5px);
      line-height: 1.5;
    }
    .hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
    }
    .footer {
      margin-bottom: 6px;
    }
    .message {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🌙 マロンの添い寝部屋</div>
    
    <!-- BGMコントローラー -->
    <div class="audio-player">
      <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
      <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
      <button class="audio-btn" onclick="nextBgm()">⏭</button>
    </div>
  </div>

  <div class="main-stage" onclick="tapMarron()">
    <div class="marron-circle">
      <img src="marron.gif"　style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
      <img src="marron.gif" alt="マロン">
    </div>
    <div class="bubble" id="bubbleText">
      スピー… すやすや… 💤
    </div>
    <div class="hint">（タップするとなでなでできるワン）</div>
  </div>

  <div class="footer">
    <div class="message">今日も一日、本当によく頑張ったワン。</div>
    <div class="sub">画面を開いたまま、枕元に置いて休んでね</div>
  </div>

  <!-- BGM用オーディオタグ -->
  <audio id="bgmAudio" preload="auto"></audio>

  <script>
    // 4曲のリスト（※実際のファイル名に合わせて変更してください）
    const bgmList = [
      'bgm1.mp3',
      'bgm2.mp3',
      'bgm3.mp3',
      'bgm4.mp3'
    ];

    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');

    // 眠りを妨げない優しい音量（30%）
    audio.volume = 0.3;

    // ランダムに曲を選んで再生
    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => {
        console.log('再生待機中:', err);
      });
    }

    // 再生 / 停止の切り替え
    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    // 次の曲へスキップ
    function nextBgm() {
      playRandomBgm();
    }

    // 1曲終わったら自動で次の曲をランダム再生
    audio.addEventListener('ended', () => {
      playRandomBgm();
    });

    // メッセージリスト
    const messages = [
      "スピー… すやすや… 💤",
      "むにゃ… なでなで、あったかいワン… ✨",
      "今日も生きててえらいワン… 🐾",
      "マロンはずっと隣にいるからね… 🌙",
      "ふがっ… 大丈夫、ぜんぶうまくいくワン…"
    ];
    let msgIndex = 0;

    // タップ時のお返事
    function tapMarron() {
      msgIndex = (msgIndex + 1) % messages.length;
      document.getElementById('bubbleText').innerText = messages[msgIndex];

      if (navigator.vibrate) {
        navigator.vibrate([40]);
      }
    }
  </script>
</body>
</html>
