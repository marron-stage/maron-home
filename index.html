<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家 - おやすみモード</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px 20px;
      text-align: center;
      overflow-y: auto; /* はみ出してもスクロールできるように変更 */
    }
    .header {
      margin-top: 4px;
    }
    .title {
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
    }

    /* BGMコントローラー */
    .audio-player {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .track-info {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 80px;
    }

    /* マロンのカード（画面からはみ出さないサイズ制限） */
    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      margin: 12px 0;
    }
    .marron-card {
      width: 240px;
      max-width: 75vw;
      max-height: 40vh; /* 縦長になりすぎないよう制限 */
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(246, 173, 85, 0.45);
      box-shadow: 0 0 25px rgba(246, 173, 85, 0.25);
      animation: breathe 4s ease-in-out infinite;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marron-card img {
      width: 100%;
      height: 100%;
      max-height: 40vh;
      object-fit: contain;
      display: block;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(246, 173, 85, 0.2);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 35px rgba(246, 173, 85, 0.4);
      }
    }

    .bubble {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);

      border
