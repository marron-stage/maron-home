<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マロンのお家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app-container">
    <!-- 固定タブナビゲーション -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-room="home-room">🏡 お家</button>
      <button class="tab-btn" data-room="counsel-room">🐾 相談部屋</button>
      <button class="tab-btn" data-room="sleep-room">🌙 添い寝</button>
      <button class="tab-btn" data-room="daily-room">📱 日常</button>
    </nav>

    <!-- 1. お家部屋（リビング） -->
    <section id="home-room" class="room-panel active">
      <div class="home-clock-widget">
        <div class="home-clock" id="clockDisplay">12:00</div>
        <div class="home-date" id="dateDisplay">2026.11.10 TUE</div>
      </div>

      <button id="homeBgmBtn">🎵 BGM ON</button>

      <!-- 自律歩行マロン（Canvasクロマキー透過＆奥行き連動） -->
      <div id="marronWalker">
        <div id="homeBubble"></div>
        <canvas id="marronCanvas"></canvas>
      </div>

      <!-- 歩行動画読み込み用（非表示・JS制御） -->
      <video id="marronWalkVideo" playsinline muted loop style="display: none;"></video>

      <!-- 音声：お部屋BGM & 足音 -->
      <audio id="homeAudio" src="bgm1.mp3" loop></audio>
      <audio id="footstepAudio" src="footstep.MP3" loop></audio>
    </section>

    <!-- 2. 相談部屋 -->
    <section id="counsel-room" class="room-panel">
      <video id="counselingVideo" src="marron_talk.mp4" autoplay loop muted playsinline></video>
      <div id="counselingBubble"></div>

      <div id="counselingActionArea">
        <textarea id="counselingInput" placeholder="マロンに手紙を書いてみてね（愚痴も、嬉しかったことも何でもいいワン）..."></textarea>
        <button id="sendLetterBtn">✉️ マロンに手紙を渡す</button>
      </div>

      <button id="counselResetBtn">ありがとう、またお話しするワン🐾</button>
    </section>

    <!-- 3. 添い寝部屋（完全全画面） -->
    <section id="sleep-room" class="room-panel">
      <video id="sleepVideo" src="marron_sleep.mp4" autoplay loop muted playsinline></video>
      <div id="sleepOverlay"></div>

      <div class="sleep-controls-top">
        <button id="soundToggleBtn" class="sleep-btn">🎵 添い寝サウンド</button>
        <button id="lightToggleBtn" class="sleep-btn">🌙 明かりオフ</button>
      </div>

        <audio id="sleepBreathAudio" src="sleep_breath.MP3"></audio>
        <audio id="sleepVoiceAudio" src="sleep_voice01.MP3"></audio>
        <audio id="sleepBgmAudio"></audio>
    </section>

    <!-- 4. 日常部屋（6本グリッド） -->
    <section id="daily-room" class="room-panel">
      <div class="daily-grid">
        <div class="daily-item" data-video="marron.mp4"><video src="marron.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">まったりマロン</div></div>
        <div class="daily-item" data-video="marron_cocoa.mp4"><video src="marron_cocoa.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">ココアとマロン</div></div>
        <div class="daily-item" data-video="marron_wait.mp4"><video src="marron_wait.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">おやつ待て！</div></div>
        <div class="daily-item" data-video="marron_proposal.mp4"><video src="marron_proposal.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">プロポーズ</div></div>
        <div class="daily-item" data-video="marron_rescue.mp4"><video src="marron_rescue.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">レスキュー隊</div></div>
        <div class="daily-item" data-video="marron_autumn.mp4"><video src="marron_autumn.mp4#t=0.001" preload="metadata" muted playsinline></video><div class="daily-title">秋のお散歩</div></div>
      </div>
    </section>

    <!-- 日常動画用 シネマモーダル -->
    <div id="cinemaModal">
      <button id="closeCinemaBtn">✕</button>
      <video id="cinemaVideo" controls playsinline></video>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
