<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家 - おやすみモード</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .header {
      margin-top: 4px;
    }
    .title {
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
    }

    /* BGMコントローラー */
    .audio-player {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .track-info {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 80px;
    }

    /* マロンの動画ステージ */
    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 12px 0;
      cursor: pointer;
    }
    .marron-card {
      width: 260px;
      max-width: 80vw;
      max-height: 42vh;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(246, 173, 85, 0.45);
      box-shadow: 0 0 25px rgba(246, 173, 85, 0.25);
      animation: breathe 4s ease-in-out infinite;
      background: #000;
      position: relative;
    }
    .marron-card video {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: cover;
      display: block;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(246, 173, 85, 0.2);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 35px rgba(246, 173, 85, 0.4);
      }
    }

    /* 再生数 & いいね カウンター */
    .stats-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .like-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .like-btn:active {
      transform: scale(0.92);
    }

    /* 飛び出すハート */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      animation: flyUp 1.2s ease-out forwards;
      z-index: 100;
    }
    @keyframes flyUp {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -90px) scale(1.4);
      }
    }

    .bubble {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #fbd38d;
      backdrop-filter: blur(5px);
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }
    .footer {
      margin-bottom: 6px;
    }
    .message {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.7rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🌙 マロンの添い寝部屋</div>
    
    <div class="audio-player">
      <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
      <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
      <button class="audio-btn" onclick="nextBgm()">⏭</button>
    </div>
  </div>

  <div class="main-stage">
    <!-- マロンの動画枠 -->
    <div class="marron-card" onclick="tapMarron(event)">
      <video src="marron.mp4" autoplay loop muted playsinline webkit-playsinline></video>
    </div>

    <!-- カウンターバー -->
    <div class="stats-bar">
      <span id="viewCount">👁️ 0 views</span>
      <button class="like-btn" onclick="addLike(event)">
        <span>❤️</span>
        <span id="likeCount">0</span>
      </button>
    </div>

    <div class="bubble" id="bubbleText">
      スピー… すやすや… 💤
    </div>
    <div class="hint">（タップするとなでなで＆いいねできるワン）</div>
  </div>

  <div class="footer">
    <div class="message">今日も一日、本当によく頑張ったワン。</div>
    <div class="sub">画面を開いたまま、枕元に置いて休んでね</div>
  </div>

  <audio id="bgmAudio" preload="auto"></audio>

  <script>
    // --- 1. カウンター管理（ローカル保存） ---
    let views = parseInt(localStorage.getItem('marron_views') || '0', 10) + 1;
    localStorage.setItem('marron_views', views);
    document.getElementById('viewCount').innerText = `👁️ ${views} views`;

    let likes = parseInt(localStorage.getItem('marron_likes') || '0', 10);
    document.getElementById('likeCount').innerText = likes;

    function addLike(e) {
      if (e) e.stopPropagation();
      likes += 1;
      localStorage.setItem('marron_likes', likes);
      document.getElementById('likeCount').innerText = likes;
      spawnHeart(e);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = ['❤️', '🐾', '✨', '💖'][Math.floor(Math.random() * 4)];
      
      const dx = (Math.random() - 0.5) * 80 + 'px';
      heart.style.setProperty('--dx', dx);
      
      const stage = document.querySelector('.main-stage');
      const rect = stage.getBoundingClientRect();
      
      const x = (e ? e.clientX - rect.left : rect.width / 2) - 12;
      const y = (e ? e.clientY - rect.top : rect.height / 2) - 20;
      
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      
      stage.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    // --- 2. タップ演出 ---
    const messages = [
      "スピー… すやすや… 💤",
      "むにゃ… なでなで、あったかいワン… ✨",
      "今日も生きててえらいワン… 🐾",
      "マロンはずっと隣にいるからね… 🌙",
      "ふがっ… 大丈夫、ぜんぶうまくいくワン…"
    ];
    let msgIndex = 0;

    function tapMarron(e) {
      msgIndex = (msgIndex + 1) % messages.length;
      document.getElementById('bubbleText').innerText = messages[msgIndex];
      addLike(e);
    }

    // --- 3. BGMプレイヤー ---
    const bgmList = [
      'bgm1.mp3',
      'bgm2.mp3',
      'bgm3.mp3',
      'bgm4.mp3'
    ];

    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');
    audio.volume = 0.3;

    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => {
        console.log('再生待機中:', err);
      });
    }

    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    function nextBgm() {
      playRandomBgm();
    }

    audio.addEventListener('ended', () => {
      playRandomBgm();
    });
  </script>
</body>
</html>
