<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 上部タブ切り替えバー */
    .tab-bar {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(246, 173, 85, 0.25);
      color: #fbd38d;
      border: 1px solid rgba(246, 173, 85, 0.4);
    }

    /* 各部屋の表示切替 */
    .room-content {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .room-content.active {
      display: flex;
    }

    /* BGMコントローラー */
    .audio-player {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      margin-bottom: 12px;
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
    }
    .track-info {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 80px;
    }

    /* 添い寝部屋：GIFカード */
    .marron-sleep-card {
      width: 260px;
      max-width: 82vw;
      max-height: 42vh;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(246, 173, 85, 0.45);
      box-shadow: 0 0 25px rgba(246, 173, 85, 0.25);
      background: #000;
      animation: breathe 4s ease-in-out infinite;
      cursor: pointer;
    }
    .marron-sleep-card img {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: cover;
      display: block;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(246, 173, 85, 0.2);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 35px rgba(246, 173, 85, 0.4);
      }
    }

    /* 日常部屋：YouTube風動画カード */
    .youtube-card {
      width: 290px;
      max-width: 88vw;
      border-radius: 18px;
      overflow: hidden;
      background: #1e2538;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      position: relative;
    }
    .video-thumbnail-box {
      position: relative;
      width: 100%;
      height: 180px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-thumbnail-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* YouTube風再生ボタンバッジ */
    .play-badge {
      position: absolute;
      width: 54px;
      height: 54px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      padding-left: 4px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.15s ease;
    }
    .youtube-card:active .play-badge {
      transform: scale(0.9);
      background: rgba(239, 68, 68, 0.85);
      border-color: #ef4444;
    }
    .video-meta {
      padding: 12px 14px;
      text-align: left;
    }
    .video-meta-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .video-meta-sub {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    /* 動画切り替えセレクター */
    .video-selector {
      display: flex;
      gap: 8px;
      margin: 8px 0 14px 0;
      overflow-x: auto;
      max-width: 90vw;
      padding: 4px;
    }
    .video-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .video-chip.active {
      background: rgba(246, 173, 85, 0.25);
      border-color: #f6ad55;
      color: #fbd38d;
    }

    /* カウンターバー */
    .stats-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .like-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .like-btn:active {
      transform: scale(0.92);
    }

    /* 飛び出すハート */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      animation: flyUp 1.2s ease-out forwards;
      z-index: 100;
    }
    @keyframes flyUp {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -90px) scale(1.4);
      }
    }

    /* 吹き出し */
    .bubble {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #fbd38d;
      backdrop-filter: blur(5px);
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }

    .footer {
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .message {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.7rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- タブバー -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('sleep')">🌙 マロンの添い寝部屋</button>
    <button class="tab-btn" onclick="switchTab('daily')">🐾 マロンの日常</button>
  </div>

  <!-- ================= タブ1：添い寝部屋 ================= -->
  <div id="sleepRoom" class="room-content active">
    <div class="audio-player">
      <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
      <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
      <button class="audio-btn" onclick="nextBgm()">⏭</button>
    </div>

    <div class="marron-sleep-card" onclick="tapSleepMarron(event)">
      <img src="marron.gif" alt="マロン">
    </div>

    <div class="stats-bar">
      <button class="like-btn" onclick="addLike('sleep', event)">
        <span>❤️ なでなで</span>
        <span id="sleepLikeCount">0</span>
      </button>
    </div>

    <div class="bubble" id="sleepBubble">
      スピー… すやすや… 💤
    </div>
    <div class="hint">（タップするとなでなでできるワン）</div>
  </div>

  <!-- ================= タブ2：日常（YouTube風全画面プレイヤー） ================= -->
  <div id="dailyRoom" class="room-content">
    <!-- 動画切り替え -->
    <div class="video-selector" id="videoChips"></div>

    <!-- YouTube風カード -->
    <div class="youtube-card" onclick="playFullScreenVideo(event)">
      <div class="video-thumbnail-box">
        <video id="dailyVideoPlayer" src="marron.mp4" preload="metadata" muted playsinline></video>
        <div class="play-badge">▶</div>
      </div>
      <div class="video-meta">
        <div class="video-meta-title" id="videoTitle">まったりマロン</div>
        <div class="video-meta-sub" id="videoSubDesc">タップすると全画面で再生するワン！</div>
      </div>
    </div>

    <div class="stats-bar">
      <span id="dailyViews">👁️ 0 views</span>
      <button class="like-btn" onclick="addLike('daily', event)">
        <span>❤️ いいね</span>
        <span id="dailyLikeCount">0</span>
      </button>
    </div>

    <div class="bubble" id="dailyBubble">
      画面をタップして全画面で見てね！🐾
    </div>
  </div>

  <div class="footer">
    <div class="message" id="footerMessage">今日も一日、本当によく頑張ったワン。</div>
    <div class="sub">画面を開いたまま、枕元に置いて休んでね</div>
  </div>

  <audio id="bgmAudio" preload="auto"></audio>

  <script>
    // --- 1. タブ切り替え ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.room-content').forEach(room => room.classList.remove('active'));

      if (tab === 'sleep') {
        event.target.classList.add('active');
        document.getElementById('sleepRoom').classList.add('active');
        document.getElementById('footerMessage').innerText = "今日も一日、本当によく頑張ったワン。";
      } else {
        event.target.classList.add('active');
        document.getElementById('dailyRoom').classList.add('active');
        document.getElementById('footerMessage').innerText = "いつでもマロンを見て元気出してね🐾";
      }
    }

    // --- 2. 動画リスト ---
    const videoList = [
      { id: 'v1', title: 'まったりマロン', src: 'marron.mp4', desc: 'タップすると全画面で再生するワン！' }
      // 動画を増やしたらここに追加
    ];

    let currentVideoIdx = 0;
    const videoPlayer = document.getElementById('dailyVideoPlayer');
    const chipsContainer = document.getElementById('videoChips');

    function initVideoSelector() {
      chipsContainer.innerHTML = '';
      videoList.forEach((v, idx) => {
        const chip = document.createElement('button');
        chip.className = `video-chip ${idx === currentVideoIdx ? 'active' : ''}`;
        chip.innerText = v.title;
        chip.onclick = (e) => {
          e.stopPropagation();
          selectVideo(idx);
        };
        chipsContainer.appendChild(chip);
      });
      loadVideoStats();
    }

    function selectVideo(idx) {
      currentVideoIdx = idx;
      document.querySelectorAll('.video-chip').forEach((c, i) => {
        c.classList.toggle('active', i === idx);
      });
      videoPlayer.src = videoList[idx].src;
      document.getElementById('videoTitle').innerText = videoList[idx].title;
      document.getElementById('videoSubDesc').innerText = videoList[idx].desc;
      loadVideoStats();
    }

    // --- 3. YouTube風：タップで全画面再生！ ---
    function playFullScreenVideo(e) {
      // 再生回数を加算
      const vid = videoList[currentVideoIdx].id;
      let vCount = parseInt(localStorage.getItem(`views_${vid}`) || '0', 10) + 1;
      localStorage.setItem(`views_${vid}`, vCount);
      document.getElementById('dailyViews').innerText = `👁️ ${vCount} views`;

      // 音声を有効にして再生開始
      videoPlayer.muted = false;
      videoPlayer.play();

      // iPhone/スマホのネイティブ全画面プレイヤーを起動
      if (videoPlayer.webkitEnterFullscreen) {
        videoPlayer.webkitEnterFullscreen(); // iOS Safari
      } else if (videoPlayer.requestFullscreen) {
        videoPlayer.requestFullscreen();     // Android / PC
      }

      spawnHeart(e);
    }

    function loadVideoStats() {
      const vid = videoList[currentVideoIdx].id;
      let vCount = parseInt(localStorage.getItem(`views_${vid}`) || '0', 10);
      document.getElementById('dailyViews').innerText = `👁️ ${vCount} views`;

      let lCount = parseInt(localStorage.getItem(`likes_${vid}`) || '0', 10);
      document.getElementById('dailyLikeCount').innerText = lCount;
    }

    // --- 4. いいね & ハート演出 ---
    let sleepLikes = parseInt(localStorage.getItem('marron_sleep_likes') || '0', 10);
    document.getElementById('sleepLikeCount').innerText = sleepLikes;

    function addLike(type, e) {
      if (e) e.stopPropagation();
      if (type === 'sleep') {
        sleepLikes += 1;
        localStorage.setItem('marron_sleep_likes', sleepLikes);
        document.getElementById('sleepLikeCount').innerText = sleepLikes;
      } else {
        const vid = videoList[currentVideoIdx].id;
        let lCount = parseInt(localStorage.getItem(`likes_${vid}`) || '0', 10) + 1;
        localStorage.setItem(`likes_${vid}`, lCount);
        document.getElementById('dailyLikeCount').innerText = lCount;
      }
      spawnHeart(e);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = ['❤️', '🐾', '✨', '💖'][Math.floor(Math.random() * 4)];
      const dx = (Math.random() - 0.5) * 80 + 'px';
      heart.style.setProperty('--dx', dx);

      const target = document.querySelector('.room-content.active');
      const rect = target.getBoundingClientRect();
      const x = (e && e.clientX ? e.clientX - rect.left : rect.width / 2) - 12;
      const y = (e && e.clientY ? e.clientY - rect.top : rect.height / 2) - 20;

      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      target.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    // --- 5. 添い寝部屋タップ演出 ---
    const sleepMessages = [
      "スピー… すやすや… 💤",
      "むにゃ… なでなで、あったかいワン… ✨",
      "今日も生きててえらいワン… 🐾",
      "マロンはずっと隣にいるからね… 🌙",
      "ふがっ… 大丈夫、ぜんぶうまくいくワン…"
    ];
    let sleepMsgIdx = 0;
    function tapSleepMarron(e) {
      sleepMsgIdx = (sleepMsgIdx + 1) % sleepMessages.length;
      document.getElementById('sleepBubble').innerText = sleepMessages[sleepMsgIdx];
      addLike('sleep', e);
    }

    // --- 6. BGMプレイヤー ---
    const bgmList = ['bgm1.mp3', 'bgm2.mp3', 'bgm3.mp3', 'bgm4.mp3'];
    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');
    audio.volume = 0.3;

    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => console.log('再生待機中:', err));
    }

    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    function nextBgm() {
      playRandomBgm();
    }

    audio.addEventListener('ended', () => playRandomBgm());

    // 初期化
    initVideoSelector();
  </script>
</body>
</html>
