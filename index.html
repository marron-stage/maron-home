<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マロンのお家 - おやすみモード</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121624;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: center;
      overflow: hidden;
    }
    .header {
      margin-top: 6px;
    }
    .title {
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
    }

    /* BGMコントローラー */
    .audio-player {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: opacity 0.2s;
    }
    .audio-btn:active {
      opacity: 0.6;
    }
    .track-info {
      font-size: 0.78rem;
      color: #94a3b8;
      min-width: 90px;
    }

    /* マロンのフレーム */
    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .marron-card {
      width: 270px;
      max-width: 82vw;
      border-radius: 24px;
      overflow: hidden;

      box-shadow: 0
