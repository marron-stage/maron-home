<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マロンのお家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #06080e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }

    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 最前面ヘッダー（タブバー） */
    .top-header {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 10px 12px;
      z-index: 100;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      background: rgba(13, 16, 27, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 5px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: rgba(246, 173, 85, 0.28);
      color: #fbd38d;
      border: 1px solid rgba(246, 173, 85, 0.45);
      font-weight: 600;
    }

    /* 画面共通 */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .screen.active {
      display: block;
    }

    /* ================= 画面1：全画面お部屋 ================= */
    #livingRoom {
      background-image: url('room.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .sound-badge {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 60px);
      right: 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .sound-badge.on {
      border-color: rgba(246, 173, 85, 0.7);
      background: rgba(246, 173, 85, 0.25);
      color: #fbd38d;
      font-weight: 600;
    }

    #marronCanvas {
      position: absolute;
      will-change: left, top, transform, height;
      z-index: 40;
      pointer-events: none;
    }

    /* ================= 画面2：添い寝部屋 ================= */
    #sleepRoom {
      background: radial-gradient(circle at center 40%, #111524 0%, #040508 100%);
      transition: background 0.5s ease;
    }
    #sleepRoom.night-mode {
      background: radial-gradient(circle at center 40%, #090b14 0%, #020204 100%);
    }

    .sleep-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: calc(env(safe-area-inset-top, 10px) + 60px) 16px calc(env(safe-area-inset-bottom, 10px) + 20px) 16px;
      text-align: center;
    }

    /* コントロールバー（BGM再生 ＋ 寝言再生 ＋ 間接照明） */
    .sleep-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }

    .audio-player {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .track-info {
      font-size: 0.78rem;
      color: #94a3b8;
      min-width: 75px;
    }

    /* 寝言の再生 / 停止トグルボタン */
    .sleep-voice-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .sleep-voice-toggle.active {
      background: rgba(246, 173, 85, 0.25);
      border-color: rgba(246, 173, 85, 0.7);
      color: #fbd38d;
      font-weight: 600;
    }

    /* 間接照明ボタン */
    .lamp-toggle-btn {
      background: rgba(246, 173, 85, 0.2);
      border: 1px solid rgba(246, 173, 85, 0.5);
      color: #fbd38d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .lamp-toggle-btn.off {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      color: #64748b;
    }

    /* 添い寝動画カード */
    .marron-sleep-card {
      position: relative;
      width: 270px;
      height: 420px;
      max-width: 82vw;
      max-height: 56vh;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      border: 1.5px solid rgba(246, 173, 85, 0.35);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 50px rgba(246, 173, 85, 0.35);
      transition: box-shadow 0.6s ease, border-color 0.6s ease;
    }
    .marron-sleep-card.dark {
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .marron-sleep-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.72) contrast(1.08) saturate(0.85) sepia(0.18);
      transition: filter 0.6s ease;
    }
    .marron-sleep-card.dark video {
      filter: brightness(0.48) contrast(1.15) saturate(0.7) sepia(0.08);
    }

    /* ================= 画面3：日常部屋（Netflix風カルーセル） ================= */
    #dailyRoom {
      background: #07090e;
    }
    .netflix-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: calc(env(safe-area-inset-top, 10px) + 56px) 16px calc(env(safe-area-inset-bottom, 10px) + 16px) 16px;
      justify-content: space-between;
    }

    .netflix-hero-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .netflix-hero-card {
      position: relative;
      width: 100%;
      max-width: 330px;
      height: 100%;
      max-height: 44vh;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .netflix-hero-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-play-badge {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(15, 18, 30, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      padding-left: 3px;
      backdrop-filter: blur(8px);
    }
    .hero-meta-title {
      margin-top: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f1f5f9;
    }

    .netflix-tray-section {
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .tray-header-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: left;
    }
    .netflix-tray-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .netflix-tray-scroll::-webkit-scrollbar {
      display: none;
    }

    .tray-thumb-card {
      flex: 0 0 110px;
      height: 130px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #151926;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tray-thumb-card.active {
      border-color: #f6ad55;
      box-shadow: 0 0 12px rgba(246, 173, 85, 0.4);
      transform: scale(1.03);
    }
    .tray-thumb-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tray-thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 60%);
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
    }
    .tray-thumb-title {
      font-size: 0.72rem;
      color: #f1f5f9;
      font-weight: 500;
      line-height: 1.2;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header class="top-header">
      <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('living')">🏡 マロンのお部屋</button>
        <button class="tab-btn" onclick="switchTab('sleep')">🌙 添い寝部屋</button>
        <button class="tab-btn" onclick="switchTab('daily')">🐾 マロンの日常</button>
      </nav>
    </header>

    <!-- ================= 画面1：全画面お部屋 ================= -->
    <main id="livingRoom" class="screen active">
      <button class="sound-badge" id="stepSoundBtn" onclick="toggleLivingAudio(event)">🔇 サウンドOFF</button>
      <canvas id="marronCanvas" width="300" height="300"></canvas>

      <video id="videoWalk" src="marron_walk.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoDiag" src="marron_diagonal.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoDiagBack" src="marron_diagonal_back.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoFront" src="marron_front.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoBack" src="marron_back.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>

      <audio id="livingBgmAudio" src="bgm1.mp3" loop preload="auto"></audio>
      <audio id="footstepAudio" src="footstep.MP3" preload="auto"></audio>
    </main>

    <!-- ================= 画面2：添い寝部屋 ================= -->
    <section id="sleepRoom" class="screen">
      <div class="sleep-container">
        <!-- 上部コントロールバー（BGM再生 ＋ 寝言再生 ＋ 間接照明） -->
        <div class="sleep-controls-bar">
          <div class="audio-player">
            <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
            <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
            <button class="audio-btn" onclick="nextBgm()">⏭</button>
          </div>
          <!-- 寝言の再生 / 停止トグルボタン -->
          <button class="sleep-voice-toggle" id="voiceToggleBtn" onclick="toggleSleepVoiceLoop()">💤 寝言再生</button>
          <!-- 間接照明切り替えスイッチ -->
          <button class="lamp-toggle-btn" id="lampBtn" onclick="toggleBedLamp()">💡 明かりON</button>
        </div>

        <div class="marron-sleep-card" id="sleepCard">
          <video id="marronSleepVideo" src="marron_sleep.mp4" autoplay loop muted playsinline webkit-playsinline></video>
        </div>
      </div>

      <audio id="bgmAudio" preload="auto"></audio>
      <audio id="sleepVoice01" src="sleep_voice01.MP3" preload="auto"></audio>
      <audio id="sleepVoice02" src="sleep_voice02.MP3" preload="auto"></audio>
    </section>

    <!-- ================= 画面3：日常部屋（Netflix風カルーセル） ================= -->
    <section id="dailyRoom" class="screen">
      <div class="netflix-container">
        <div class="netflix-hero-wrapper">
          <div class="netflix-hero-card" onclick="playFullScreenVideo()">
            <video id="dailyVideoPlayer" src="marron.mp4" preload="metadata" muted playsinline></video>
            <div class="hero-play-badge">
              <div class="play-circle">▶</div>
            </div>
          </div>
          <div class="hero-meta-title" id="videoHeroTitle">まったりマロン</div>
        </div>

        <div class="netflix-tray-section">
          <div class="tray-header-label">Episodes / マロンの記録</div>
          <div class="netflix-tray-scroll" id="netflixTray"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // 1. タブ切り替え
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));

      if (tab === 'living') {
        event.target.classList.add('active');
        document.getElementById('livingRoom').classList.add('active');
        stopSleepRoomAudio();
        if (isSoundOn) startLivingAudio();
      } else if (tab === 'sleep') {
        event.target.classList.add('active');
        document.getElementById('sleepRoom').classList.add('active');
        stopLivingAudio();
      } else {
        event.target.classList.add('active');
        document.getElementById('dailyRoom').classList.add('active');
        stopLivingAudio();
        stopSleepRoomAudio();
      }
    }

    // 2. お部屋自律歩行（正面歩き速度ダウン ＆ 等速歩行）
    const canvas = document.getElementById('marronCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const videoWalk = document.getElementById('videoWalk');
    const videoDiag = document.getElementById('videoDiag');
    const videoDiagBack = document.getElementById('videoDiagBack');
    const videoFront = document.getElementById('videoFront');
    const videoBack = document.getElementById('videoBack');

    videoFront.playbackRate = 0.85;

    const livingBgm = document.getElementById('livingBgmAudio');
    const footstepAudio = document.getElementById('footstepAudio');
    const soundBtn = document.getElementById('stepSoundBtn');

    livingBgm.volume = 0.35;
    footstepAudio.volume = 0.20;

    let currentVideo = videoWalk;
    let isSoundOn = false;

    function getBounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      return {
        minX: 20,
        maxX: w - 150,
        minY: h * 0.40,
        maxY: h * 0.80
      };
    }

    function isPlantObstacle(x, y, w, h) {
      return (x < w * 0.32 && y < h * 0.56);
    }

    const CYCLE_DURATION = 4000;
    const DEFAULT_STEP_DISTANCE = 110;
    const FRONT_STEP_DISTANCE = 75;

    let sessionStartTime = 0;
    let startX = 60;
    let startY = window.innerHeight * 0.65;
    let currentX = startX;
    let currentY = startY;
    let targetX = startX;
    let targetY = startY;

    function startNextWalkSession() {
      const b = getBounds();
      const w = window.innerWidth;
      const h = window.innerHeight;

      startX = currentX;
      startY = currentY;

      const directions = [
        0, Math.PI / 4, Math.PI / 2, (3 * Math.PI) / 4,
        Math.PI, -(3 * Math.PI) / 4, -Math.PI / 2, -Math.PI / 4
      ];
      directions.sort(() => Math.random() - 0.5);

      let chosenAngle = 0;
      let validFound = false;

      for (let angle of directions) {
        const isHeadingDown = angle > Math.PI / 3 && angle < (2 * Math.PI) / 3;
        const stepDist = isHeadingDown ? FRONT_STEP_DISTANCE : DEFAULT_STEP_DISTANCE;

        const testX = startX + Math.cos(angle) * stepDist;
        const testY = startY + Math.sin(angle) * stepDist;

        if (
          testX >= b.minX && testX <= b.maxX &&
          testY >= b.minY && testY <= b.maxY &&
          !isPlantObstacle(testX, testY, w, h)
        ) {
          chosenAngle = angle;
          targetX = testX;
          targetY = testY;
          validFound = true;
          break;
        }
      }

      if (!validFound) {
        const angleToCenter = Math.atan2((h * 0.65) - startY, (w * 0.5) - startX);
        chosenAngle = angleToCenter;
        targetX = startX + Math.cos(chosenAngle) * DEFAULT_STEP_DISTANCE;
        targetY = startY + Math.sin(chosenAngle) * DEFAULT_STEP_DISTANCE;
      }

      sessionStartTime = performance.now();

      const dx = targetX - startX;
      const dy = targetY - startY;
      const absDx = Math.abs(dx);
      const angleDeg = Math.atan2(dy, absDx) * (180 / Math.PI);

      if (angleDeg < -67.5) {
        currentVideo = videoBack;
        canvas.style.transform = 'scaleX(1)';
      } else if (angleDeg < -22.5) {
        currentVideo = videoDiagBack;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else if (angleDeg <= 22.5) {
        currentVideo = videoWalk;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else if (angleDeg <= 67.5) {
        currentVideo = videoDiag;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else {
        currentVideo = videoFront;
        canvas.style.transform = 'scaleX(1)';
      }

      if (currentVideo.readyState >= 2) {
        currentVideo.currentTime = 0;
      }

      if (isSoundOn) {
        triggerStepSound();
      }
    }

    function renderChromaLoop(now) {
      if (document.getElementById('livingRoom').classList.contains('active')) {
        const vid = currentVideo;

        if (vid.readyState >= 2) {
          if (vid.videoWidth > 0 && (canvas.width !== vid.videoWidth || canvas.height !== vid.videoHeight)) {
            canvas.width = vid.videoWidth;
            canvas.height = vid.videoHeight;
          }

          ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = frame.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const isBlue = (b > 150 && b > r + 60 && b > g + 15) || 
                           (r < 60 && g > 70 && g < 170 && b > 190);

            if (isBlue) {
              data[i + 3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }

        const elapsed = now - sessionStartTime;
        let progress = elapsed / CYCLE_DURATION;

        if (progress >= 1.0) {
          currentX = targetX;
          currentY = targetY;
          startNextWalkSession();
          progress = 0;
        } else {
          currentX = startX + (targetX - startX) * progress;
          currentY = startY + (targetY - startY) * progress;
        }

        const b = getBounds();
        const depthRatio = Math.max(0, Math.min(1, (currentY - b.minY) / (b.maxY - b.minY)));
        const marronHeight = 110 + depthRatio * 125;

        canvas.style.height = `${marronHeight}px`;
        canvas.style.left = `${currentX}px`;
        canvas.style.top = `${currentY}px`;
      }

      requestAnimationFrame(renderChromaLoop);
    }

    function toggleLivingAudio(e) {
      if (e) e.stopPropagation();
      isSoundOn = !isSoundOn;

      if (isSoundOn) {
        soundBtn.innerText = '🔊 サウンドON';
        soundBtn.classList.add('on');
        startLivingAudio();
      } else {
        soundBtn.innerText = '🔇 サウンドOFF';
        soundBtn.classList.remove('on');
        stopLivingAudio();
      }
    }

    function startLivingAudio() {
      const isLiving = document.getElementById('livingRoom').classList.contains('active');
      if (isLiving && isSoundOn) {
        livingBgm.play().catch(() => {});
        triggerStepSound();
      }
    }

    function stopLivingAudio() {
      livingBgm.pause();
      footstepAudio.pause();
      footstepAudio.currentTime = 0;
    }

    function triggerStepSound() {
      const isLiving = document.getElementById('livingRoom').classList.contains('active');
      if (isLiving && isSoundOn) {
        footstepAudio.currentTime = 0;
        footstepAudio.play().catch(() => {});
      }
    }

    function startAllVideos() {
      [videoWalk, videoDiag, videoDiagBack, videoFront, videoBack].forEach(v => {
        v.muted = true;
        v.play().catch(() => {});
      });
      const sleepVid = document.getElementById('marronSleepVideo');
      if (sleepVid) sleepVid.play().catch(() => {});
    }

    startAllVideos();
    startNextWalkSession();
    requestAnimationFrame(renderChromaLoop);

    // 3. 添い寝部屋演出（寝言再生ループ ＆ 間接照明 ＆ BGM）
    const voice01 = document.getElementById('sleepVoice01');
    const voice02 = document.getElementById('sleepVoice02');
    const sleepCard = document.getElementById('sleepCard');
    const lampBtn = document.getElementById('lampBtn');
    const sleepRoom = document.getElementById('sleepRoom');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');

    // 耳元で心地よく聴こえる音量に設定
    voice01.volume = 0.25;
    voice02.volume = 0.25;

    let isVoiceLoopActive = false;
    let voiceLoopTimer = null;

    // 寝言の再生 / 停止切り替え
    function toggleSleepVoiceLoop() {
      isVoiceLoopActive = !isVoiceLoopActive;
      if (isVoiceLoopActive) {
        voiceToggleBtn.innerText = '💤 寝言停止';
        voiceToggleBtn.classList.add('active');
        playNextSleepVoice();
      } else {
        stopSleepVoiceLoop();
      }
    }

    function playNextSleepVoice() {
      if (!isVoiceLoopActive) return;
      const isSleep = document.getElementById('sleepRoom').classList.contains('active');
      if (!isSleep) return;

      const chosenVoice = Math.random() > 0.5 ? voice01 : voice02;
      chosenVoice.currentTime = 0;
      chosenVoice.play().catch(() => {});

      // 音声が鳴り終わったら、自然な呼吸間隔（4〜7秒）を置いて次の寝言を鳴らす
      chosenVoice.onended = () => {
        if (!isVoiceLoopActive) return;
        const breathDelay = 4000 + Math.random() * 3000;
        voiceLoopTimer = setTimeout(playNextSleepVoice, breathDelay);
      };
    }

    function stopSleepVoiceLoop() {
      isVoiceLoopActive = false;
      clearTimeout(voiceLoopTimer);
      voice01.pause();
      voice02.pause();
      voice01.currentTime = 0;
      voice02.currentTime = 0;
      voice01.onended = null;
      voice02.onended = null;
      voiceToggleBtn.innerText = '💤 寝言再生';
      voiceToggleBtn.classList.remove('active');
    }

    let isLampOn = true;
    function toggleBedLamp() {
      isLampOn = !isLampOn;
      if (isLampOn) {
        lampBtn.innerText = '💡 明かりON';
        lampBtn.classList.remove('off');
        sleepCard.classList.remove('dark');
        sleepRoom.classList.remove('night-mode');
      } else {
        lampBtn.innerText = '🌑 消灯中';
        lampBtn.classList.add('off');
        sleepCard.classList.add('dark');
        sleepRoom.classList.add('night-mode');
      }
    }

    function stopSleepRoomAudio() {
      stopSleepVoiceLoop();
      const bgm = document.getElementById('bgmAudio');
      if (bgm) bgm.pause();
      const playBtn = document.getElementById('playBtn');
      if (playBtn) playBtn.innerText = '▶ 再生';
    }

    // 4. 日常部屋（Netflix風カルーセル制御）
    const videoList = [
      { id: 'v1', title: 'まったりマロン', src: 'marron.mp4' }
    ];
    let currentVideoIdx = 0;
    const dailyVideoPlayer = document.getElementById('dailyVideoPlayer');
    const trayContainer = document.getElementById('netflixTray');

    function initNetflixTray() {
      trayContainer.innerHTML = '';
      videoList.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = `tray-thumb-card ${idx === currentVideoIdx ? 'active' : ''}`;
        card.onclick = () => selectTrayVideo(idx);

        card.innerHTML = `
          <video src="${v.src}" preload="metadata" muted playsinline></video>
          <div class="tray-thumb-overlay">
            <span class="tray-thumb-title">${v.title}</span>
          </div>
        `;
        trayContainer.appendChild(card);
      });
    }

    function selectTrayVideo(idx) {
      currentVideoIdx = idx;
      document.querySelectorAll('.tray-thumb-card').forEach((c, i) => c.classList.toggle('active', i === idx));
      dailyVideoPlayer.src = videoList[idx].src;
      document.getElementById('videoHeroTitle').innerText = videoList[idx].title;
    }

    function playFullScreenVideo() {
      dailyVideoPlayer.muted = false;
      dailyVideoPlayer.play();

      if (dailyVideoPlayer.webkitEnterFullscreen) {
        dailyVideoPlayer.webkitEnterFullscreen();
      } else if (dailyVideoPlayer.requestFullscreen) {
        dailyVideoPlayer.requestFullscreen();
      }
    }

    // 5. 添い寝部屋用BGM
    const bgmList = ['bgm1.mp3', 'bgm2.mp3', 'bgm3.mp3', 'bgm4.mp3'];
    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');
    audio.volume = 0.3;

    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => console.log('再生待機中:', err));
    }

    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    function nextBgm() {
      playRandomBgm();
    }
    audio.addEventListener('ended', () => playRandomBgm());

    initNetflixTray();
  </script>
</body>
</html>
