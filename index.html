<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マロンのお家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #080a10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }

    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 最前面ヘッダー（タブバー） */
    .top-header {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 10px 12px;
      z-index: 100;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      background: rgba(13, 16, 27, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 5px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: rgba(246, 173, 85, 0.28);
      color: #fbd38d;
      border: 1px solid rgba(246, 173, 85, 0.45);
      font-weight: 600;
    }

    /* 画面共通 */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .screen.active {
      display: block;
    }

    /* ================= 画面1：全画面お部屋 ================= */
    #livingRoom {
      background-image: url('room.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .sound-badge {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 60px);
      right: 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .sound-badge.on {
      border-color: rgba(246, 173, 85, 0.7);
      background: rgba(246, 173, 85, 0.25);
      color: #fbd38d;
      font-weight: 600;
    }

    #marronCanvas {
      position: absolute;
      will-change: left, top, transform, height;
      z-index: 40;
      pointer-events: none;
    }

    /* ================= 画面2：添い寝部屋（ミニマル・ナイト） ================= */
    #sleepRoom {
      background: radial-gradient(circle at center 45%, #151a2e 0%, #06080e 100%);
    }
    .sleep-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: calc(env(safe-area-inset-top, 10px) + 60px) 16px calc(env(safe-area-inset-bottom, 10px) + 20px) 16px;
      text-align: center;
    }

    .audio-player {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
      z-index: 10;
    }
    .audio-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .track-info {
      font-size: 0.78rem;
      color: #94a3b8;
      min-width: 80px;
      letter-spacing: 0.5px;
    }

    /* 動画カード（息づくアンビエントフレーム） */
    .marron-sleep-card {
      position: relative;
      width: 270px;
      height: 420px;
      max-width: 82vw;
      max-height: 58vh;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(246, 173, 85, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(246, 173, 85, 0.15);
      background: #000;
      animation: sleepGlow 6s ease-in-out infinite alternate;
    }
    .marron-sleep-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes sleepGlow {
      0% { box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 15px rgba(246, 173, 85, 0.1); }
      100% { box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 35px rgba(246, 173, 85, 0.28); }
    }

    /* ================= 画面3：日常部屋（ミニマルシアター） ================= */
    #dailyRoom {
      background: radial-gradient(circle at center, #141724 0%, #06070b 100%);
    }
    .daily-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: calc(env(safe-area-inset-top, 10px) + 60px) 16px calc(env(safe-area-inset-bottom, 10px) + 20px) 16px;
      text-align: center;
    }

    .theater-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
      max-width: 90vw;
      padding: 4px;
    }
    .theater-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .theater-chip.active {
      background: rgba(246, 173, 85, 0.25);
      border-color: rgba(246, 173, 85, 0.6);
      color: #fbd38d;
      font-weight: 500;
    }

    /* シネマスクリーンカード */
    .cinema-screen-card {
      position: relative;
      width: 320px;
      height: 440px;
      max-width: 86vw;
      max-height: 58vh;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }
    .cinema-screen-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .play-btn-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(18, 22, 36, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.6rem;
      padding-left: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .cinema-caption {
      margin-top: 14px;
      font-size: 0.9rem;
      letter-spacing: 0.8px;
      color: #cbd5e1;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header class="top-header">
      <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('living')">🏡 マロンのお部屋</button>
        <button class="tab-btn" onclick="switchTab('sleep')">🌙 添い寝部屋</button>
        <button class="tab-btn" onclick="switchTab('daily')">🐾 マロンの日常</button>
      </nav>
    </header>

    <!-- ================= 画面1：全画面お部屋 ================= -->
    <main id="livingRoom" class="screen active">
      <button class="sound-badge" id="stepSoundBtn" onclick="toggleLivingAudio(event)">🔇 サウンドOFF</button>
      <canvas id="marronCanvas" width="300" height="300"></canvas>

      <video id="videoWalk" src="marron_walk.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoDiag" src="marron_diagonal.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoDiagBack" src="marron_diagonal_back.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoFront" src="marron_front.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>
      <video id="videoBack" src="marron_back.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>

      <audio id="livingBgmAudio" src="bgm1.mp3" loop preload="auto"></audio>
      <audio id="footstepAudio" src="footstep.MP3" preload="auto"></audio>
    </main>

    <!-- ================= 画面2：添い寝部屋 ================= -->
    <section id="sleepRoom" class="screen">
      <div class="sleep-container">
        <div class="audio-player">
          <button class="audio-btn" id="playBtn" onclick="toggleBgm()">▶ 再生</button>
          <span class="track-info" id="trackInfo">♪ おやすみBGM</span>
          <button class="audio-btn" onclick="nextBgm()">⏭</button>
        </div>

        <div class="marron-sleep-card">
          <video id="marronSleepVideo" src="marron_sleep.mp4" autoplay loop muted playsinline webkit-playsinline></video>
        </div>
      </div>

      <audio id="bgmAudio" preload="auto"></audio>
      <audio id="sleepVoice01" src="sleep_voice01.MP3" preload="auto"></audio>
      <audio id="sleepVoice02" src="sleep_voice02.MP3" preload="auto"></audio>
    </section>

    <!-- ================= 画面3：日常部屋（ミニマルシアター） ================= -->
    <section id="dailyRoom" class="screen">
      <div class="daily-container">
        <div class="theater-selector" id="videoChips"></div>

        <div class="cinema-screen-card" onclick="playFullScreenVideo()">
          <video id="dailyVideoPlayer" src="marron.mp4" preload="metadata" muted playsinline></video>
          <div class="play-overlay">
            <div class="play-btn-circle">▶</div>
          </div>
        </div>

        <div class="cinema-caption" id="videoTitle">まったりマロン</div>
      </div>
    </section>
  </div>

  <script>
    // 1. タブ切り替え
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));

      if (tab === 'living') {
        event.target.classList.add('active');
        document.getElementById('livingRoom').classList.add('active');
        stopSleepRoomAudio();
        if (isSoundOn) startLivingAudio();
      } else if (tab === 'sleep') {
        event.target.classList.add('active');
        document.getElementById('sleepRoom').classList.add('active');
        stopLivingAudio();
        startSleepRoomTimer();
      } else {
        event.target.classList.add('active');
        document.getElementById('dailyRoom').classList.add('active');
        stopLivingAudio();
        stopSleepRoomAudio();
      }
    }

    // 2. お部屋自律歩行（正面歩き速度ダウン ＆ 等速歩行）
    const canvas = document.getElementById('marronCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const videoWalk = document.getElementById('videoWalk');
    const videoDiag = document.getElementById('videoDiag');
    const videoDiagBack = document.getElementById('videoDiagBack');
    const videoFront = document.getElementById('videoFront');
    const videoBack = document.getElementById('videoBack');

    // 正面歩きの足の回転速度を0.85倍に落ち着かせる
    videoFront.playbackRate = 0.85;

    const livingBgm = document.getElementById('livingBgmAudio');
    const footstepAudio = document.getElementById('footstepAudio');
    const soundBtn = document.getElementById('stepSoundBtn');

    livingBgm.volume = 0.35;
    footstepAudio.volume = 0.20;

    let currentVideo = videoWalk;
    let isSoundOn = false;

    function getBounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      return {
        minX: 20,
        maxX: w - 150,
        minY: h * 0.40,
        maxY: h * 0.80
      };
    }

    function isPlantObstacle(x, y, w, h) {
      return (x < w * 0.32 && y < h * 0.56);
    }

    const CYCLE_DURATION = 4000;
    const DEFAULT_STEP_DISTANCE = 110;
    const FRONT_STEP_DISTANCE = 75; // 手前歩きの移動距離を抑えて滑り足を解消

    let sessionStartTime = 0;
    let startX = 60;
    let startY = window.innerHeight * 0.65;
    let currentX = startX;
    let currentY = startY;
    let targetX = startX;
    let targetY = startY;

    function startNextWalkSession() {
      const b = getBounds();
      const w = window.innerWidth;
      const h = window.innerHeight;

      startX = currentX;
      startY = currentY;

      const directions = [
        0, Math.PI / 4, Math.PI / 2, (3 * Math.PI) / 4,
        Math.PI, -(3 * Math.PI) / 4, -Math.PI / 2, -Math.PI / 4
      ];
      directions.sort(() => Math.random() - 0.5);

      let chosenAngle = 0;
      let validFound = false;

      for (let angle of directions) {
        // 下方向（正面歩き）に近い角度の場合は歩行距離を短縮
        const isHeadingDown = angle > Math.PI / 3 && angle < (2 * Math.PI) / 3;
        const stepDist = isHeadingDown ? FRONT_STEP_DISTANCE : DEFAULT_STEP_DISTANCE;

        const testX = startX + Math.cos(angle) * stepDist;
        const testY = startY + Math.sin(angle) * stepDist;

        if (
          testX >= b.minX && testX <= b.maxX &&
          testY >= b.minY && testY <= b.maxY &&
          !isPlantObstacle(testX, testY, w, h)
        ) {
          chosenAngle = angle;
          targetX = testX;
          targetY = testY;
          validFound = true;
          break;
        }
      }

      if (!validFound) {
        const angleToCenter = Math.atan2((h * 0.65) - startY, (w * 0.5) - startX);
        chosenAngle = angleToCenter;
        targetX = startX + Math.cos(chosenAngle) * DEFAULT_STEP_DISTANCE;
        targetY = startY + Math.sin(chosenAngle) * DEFAULT_STEP_DISTANCE;
      }

      sessionStartTime = performance.now();

      const dx = targetX - startX;
      const dy = targetY - startY;
      const absDx = Math.abs(dx);
      const angleDeg = Math.atan2(dy, absDx) * (180 / Math.PI);

      if (angleDeg < -67.5) {
        currentVideo = videoBack;
        canvas.style.transform = 'scaleX(1)';
      } else if (angleDeg < -22.5) {
        currentVideo = videoDiagBack;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else if (angleDeg <= 22.5) {
        currentVideo = videoWalk;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else if (angleDeg <= 67.5) {
        currentVideo = videoDiag;
        canvas.style.transform = dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      } else {
        currentVideo = videoFront;
        canvas.style.transform = 'scaleX(1)';
      }

      if (currentVideo.readyState >= 2) {
        currentVideo.currentTime = 0;
      }

      if (isSoundOn) {
        triggerStepSound();
      }
    }

    function renderChromaLoop(now) {
      if (document.getElementById('livingRoom').classList.contains('active')) {
        const vid = currentVideo;

        if (vid.readyState >= 2) {
          if (vid.videoWidth > 0 && (canvas.width !== vid.videoWidth || canvas.height !== vid.videoHeight)) {
            canvas.width = vid.videoWidth;
            canvas.height = vid.videoHeight;
          }

          ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = frame.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const isBlue = (b > 150 && b > r + 60 && b > g + 15) || 
                           (r < 60 && g > 70 && g < 170 && b > 190);

            if (isBlue) {
              data[i + 3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }

        const elapsed = now - sessionStartTime;
        let progress = elapsed / CYCLE_DURATION;

        if (progress >= 1.0) {
          currentX = targetX;
          currentY = targetY;
          startNextWalkSession();
          progress = 0;
        } else {
          currentX = startX + (targetX - startX) * progress;
          currentY = startY + (targetY - startY) * progress;
        }

        const b = getBounds();
        const depthRatio = Math.max(0, Math.min(1, (currentY - b.minY) / (b.maxY - b.minY)));
        const marronHeight = 110 + depthRatio * 125;

        canvas.style.height = `${marronHeight}px`;
        canvas.style.left = `${currentX}px`;
        canvas.style.top = `${currentY}px`;
      }

      requestAnimationFrame(renderChromaLoop);
    }

    function toggleLivingAudio(e) {
      if (e) e.stopPropagation();
      isSoundOn = !isSoundOn;

      if (isSoundOn) {
        soundBtn.innerText = '🔊 サウンドON';
        soundBtn.classList.add('on');
        startLivingAudio();
      } else {
        soundBtn.innerText = '🔇 サウンドOFF';
        soundBtn.classList.remove('on');
        stopLivingAudio();
      }
    }

    function startLivingAudio() {
      const isLiving = document.getElementById('livingRoom').classList.contains('active');
      if (isLiving && isSoundOn) {
        livingBgm.play().catch(() => {});
        triggerStepSound();
      }
    }

    function stopLivingAudio() {
      livingBgm.pause();
      footstepAudio.pause();
      footstepAudio.currentTime = 0;
    }

    function triggerStepSound() {
      const isLiving = document.getElementById('livingRoom').classList.contains('active');
      if (isLiving && isSoundOn) {
        footstepAudio.currentTime = 0;
        footstepAudio.play().catch(() => {});
      }
    }

    function startAllVideos() {
      [videoWalk, videoDiag, videoDiagBack, videoFront, videoBack].forEach(v => {
        v.muted = true;
        v.play().catch(() => {});
      });
      const sleepVid = document.getElementById('marronSleepVideo');
      if (sleepVid) sleepVid.play().catch(() => {});
    }

    startAllVideos();
    startNextWalkSession();
    requestAnimationFrame(renderChromaLoop);

    // 3. 添い寝部屋演出（2種類のランダム寝言 ＆ BGM）
    const voice01 = document.getElementById('sleepVoice01');
    const voice02 = document.getElementById('sleepVoice02');
    voice01.volume = 0.45;
    voice02.volume = 0.45;

    let sleepVoiceTimer = null;

    function playRandomSleepVoice() {
      const isSleep = document.getElementById('sleepRoom').classList.contains('active');
      if (!isSleep) return;

      const chosenVoice = Math.random() > 0.5 ? voice01 : voice02;
      chosenVoice.currentTime = 0;
      chosenVoice.play().catch(() => {});

      const nextDelay = 45000 + Math.random() * 35000;
      sleepVoiceTimer = setTimeout(playRandomSleepVoice, nextDelay);
    }

    function startSleepRoomTimer() {
      clearTimeout(sleepVoiceTimer);
      const initialDelay = 15000 + Math.random() * 15000;
      sleepVoiceTimer = setTimeout(playRandomSleepVoice, initialDelay);
    }

    function stopSleepRoomAudio() {
      clearTimeout(sleepVoiceTimer);
      voice01.pause();
      voice02.pause();
      const bgm = document.getElementById('bgmAudio');
      if (bgm) bgm.pause();
      const playBtn = document.getElementById('playBtn');
      if (playBtn) playBtn.innerText = '▶ 再生';
    }

    // 4. 日常部屋（ミニマルシアター制御）
    const videoList = [
      { id: 'v1', title: 'まったりマロン', src: 'marron.mp4' }
    ];
    let currentVideoIdx = 0;
    const dailyVideoPlayer = document.getElementById('dailyVideoPlayer');
    const chipsContainer = document.getElementById('videoChips');

    function initVideoSelector() {
      chipsContainer.innerHTML = '';
      videoList.forEach((v, idx) => {
        const chip = document.createElement('button');
        chip.className = `theater-chip ${idx === currentVideoIdx ? 'active' : ''}`;
        chip.innerText = v.title;
        chip.onclick = (e) => { e.stopPropagation(); selectVideo(idx); };
        chipsContainer.appendChild(chip);
      });
    }

    function selectVideo(idx) {
      currentVideoIdx = idx;
      document.querySelectorAll('.theater-chip').forEach((c, i) => c.classList.toggle('active', i === idx));
      dailyVideoPlayer.src = videoList[idx].src;
      document.getElementById('videoTitle').innerText = videoList[idx].title;
    }

    function playFullScreenVideo() {
      dailyVideoPlayer.muted = false;
      dailyVideoPlayer.play();

      if (dailyVideoPlayer.webkitEnterFullscreen) {
        dailyVideoPlayer.webkitEnterFullscreen();
      } else if (dailyVideoPlayer.requestFullscreen) {
        dailyVideoPlayer.requestFullscreen();
      }
    }

    // 5. 添い寝部屋用BGM
    const bgmList = ['bgm1.mp3', 'bgm2.mp3', 'bgm3.mp3', 'bgm4.mp3'];
    let currentTrackIndex = -1;
    const audio = document.getElementById('bgmAudio');
    const playBtn = document.getElementById('playBtn');
    const trackInfo = document.getElementById('trackInfo');
    audio.volume = 0.3;

    function playRandomBgm() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * bgmList.length);
      } while (bgmList.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      audio.src = bgmList[currentTrackIndex];
      audio.play().then(() => {
        playBtn.innerText = '⏸ 停止';
        trackInfo.innerText = `♪ BGM ${currentTrackIndex + 1}`;
      }).catch(err => console.log('再生待機中:', err));
    }

    function toggleBgm() {
      if (audio.paused) {
        if (!audio.src || currentTrackIndex === -1) {
          playRandomBgm();
        } else {
          audio.play();
          playBtn.innerText = '⏸ 停止';
        }
      } else {
        audio.pause();
        playBtn.innerText = '▶ 再生';
      }
    }

    function nextBgm() {
      playRandomBgm();
    }
    audio.addEventListener('ended', () => playRandomBgm());

    initVideoSelector();
  </script>
</body>
</html>
